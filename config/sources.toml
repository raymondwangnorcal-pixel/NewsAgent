[settings]
lookback_hours = 30
max_articles = 240
max_chars_per_message_sms = 1400
max_stories_per_category_sms = 6
max_sources_per_story = 3
include_links_sms = false
include_links_telegram = false

[fetch_reserves]
business_tech = 40
domestic = 40
global = 40
finance = 40
culture = 30

[importance]
enabled = true
logistic_midpoint = 12.0
logistic_steepness = 0.30
llm_weight = 0.65
clamp_down = 25.0
clamp_up = 100.0
deck_target = 25
big_day_importance_threshold = 70.0
big_day_requires_corroboration = true
calibration_version = "total-score-v1-2026-07-21"

[openai_costs]
enabled = true
model = "gpt-5.6-terra"
max_cost_usd_per_run = 1.00
# Standard API pricing verified against OpenAI's gpt-5.6-terra model page on 2026-07-23.
input_cost_usd_per_million_tokens = 2.5
output_cost_usd_per_million_tokens = 15.0

[drafting]
model = "gpt-5.6-terra"
max_output_tokens_per_batch = 6000

[compression]
enabled = true
model = "gpt-5.6-terra"
min_words_to_compress = 40
min_words_floor = 20
compress_fallback_drafts = false
guard_entities = true
max_output_tokens_per_batch = 1200

[selection]
max_per_source_per_category = 2
big_day_source_cap = 3

[selection_limits.business_tech]
floor = 3
ceiling = 5
big_day_max = 6

[selection_limits.domestic]
floor = 3
ceiling = 5
big_day_max = 6

[selection_limits.global]
floor = 3
ceiling = 5
big_day_max = 6

[selection_limits.finance]
floor = 3
ceiling = 5
big_day_max = 6

[selection_limits.culture]
floor = 2
ceiling = 5
big_day_max = 6

[enrichment]
enabled = true
max_clusters_per_run = 60
global_cluster_slots = 20
reserved_clusters_per_category = 8
max_articles_per_cluster = 2
max_pages_per_run = 50
request_timeout_seconds = 8
max_response_bytes = 2000000
max_extracted_chars = 6000
minimum_extracted_chars = 300
minimum_story_evidence_score = 1.2

