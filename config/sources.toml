[categories.business_tech]
label = "Business and technology"
keywords = [
  "ai", "artificial intelligence", "openai", "anthropic", "google", "microsoft",
  "apple", "nvidia", "meta", "startup", "funding", "venture", "ipo", "product",
  "launch", "layoffs", "antitrust", "regulator", "security", "cloud", "chips",
  "semiconductor", "founder", "acquisition", "merger"
]
impact_terms = [
  "billion", "million", "regulator", "lawsuit", "antitrust", "layoffs", "shutdown",
  "funding", "ipo", "launches", "acquires", "merger", "security breach"
]

[categories.domestic]
label = "Domestic U.S. news"
keywords = [
  "u.s.", "us ", "united states", "white house", "congress", "senate", "house",
  "supreme court", "federal", "state", "election", "policy", "healthcare",
  "education", "infrastructure", "public safety", "immigration", "weather"
]
impact_terms = [
  "supreme court", "congress", "federal", "ban", "rule", "emergency", "dead",
  "evacuation", "election", "policy", "healthcare", "strike"
]

[categories.global]
